<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- iOS App Icon Gradient Background: Elegant Festive Red to Coral -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="60%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    
    <!-- Subtle Top Ambient Light -->
    <radialGradient id="ambientGlow" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    
    <!-- Soft Drop Shadow for Core Icon -->
    <filter id="cakeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#7F1D1D" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full Bleed Square Background (iOS applies squircle mask automatically) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <rect width="512" height="512" fill="url(#ambientGlow)" />

  <!-- Soft Central Pedestal / Plate Accent -->
  <circle cx="256" cy="275" r="170" fill="#FFFFFF" fill-opacity="0.12" />

  <!-- Core Cake Icon in Apple Safe Zone -->
  <g filter="url(#cakeShadow)">
    <text x="256" y="340" font-size="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif">🍰</text>
  </g>
</svg>
